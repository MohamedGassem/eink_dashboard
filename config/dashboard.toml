# Points d'arrêt vérifiés via tcl_sytral.tclarret (Bellecour le 2026-09-02,
# Route de Vienne le 2026-09-03). Le choix des arrêts suivis revient à l'utilisateur.

# Un arrêt = un sens = une ligne à l'écran. `label` fixe le libellé de sens
# affiché ; les terminus partiels (Hauts de Feuilly, Essarts-Iris, …) sont
# regroupés dans la ligne de leur arrêt au lieu d'ajouter des lignes.
[[tcl.stops]]
name = "Route de Vienne (vers St-Priest)"
stop_id = "32146"
lines = ["T2"]
directions = []
label = "St-Priest"

[[tcl.stops]]
name = "Route de Vienne (vers Perrache)"
stop_id = "32147"
lines = ["T2"]
directions = []
label = "Montrochet"

# Libellés de destination bruts de l'API -> labels courts affichés.
[[tcl.direction_aliases]]
match = "Saint-Priest"
label = "St-Priest"

[[tcl.direction_aliases]]
match = "Perrache"
label = "Perrache"

# Perturbations TCL suivies (SIRI Situation Exchange). Les LineRef proviennent
# d'une capture réelle : D = "ActIV:Line::D:SYTRAL" (confirmé le 2026-09-03) ;
# T2 suit la convention observée pour T4/T7. Voir docs/tcl-sx-api-notes.md.
[tcl.disruptions]
lines = ["T2", "D"]
future_window_hours = 2

[[tcl.disruptions.line_refs]]
label = "T2"
refs = ["ActIV:Line::T2:SYTRAL"]

[[tcl.disruptions.line_refs]]
label = "D"
refs = ["ActIV:Line::D:SYTRAL"]

[[velov.stations]]
station_id = "7052"
label = "Parc Blandan"

[[velov.stations]]
station_id = "7023"
label = "Berthelot / Route de Vienne"

# Coordonnées proches des arrêts suivis (Parc Blandan / Route de Vienne).
[weather]
latitude = 45.749
longitude = 4.855
lookahead_hours = 6
rain_probability_threshold = 50
