# Dashboard e-ink Lyon — firmware ESPHome, VARIANTE MODE BATTERIE (deep sleep).
#
#   ⚠️  BROUILLON NON VALIDÉ SUR MATÉRIEL. À passer par `esphome config` puis à
#       tester selon docs/2026-09-03-test-materiel-checklist.md (§ « Mode batterie »)
#       avant de le flasher en production. Le firmware secteur `xiao-epaper.yaml`
#       reste la référence tant que ce fichier n'est pas validé.
#
# Différence avec le firmware secteur : ici l'ESP se réveille seul (deep sleep),
# fait tout le travail en un cycle, puis se rendort. Home Assistant ne pilote plus
# le rafraîchissement par un service (l'appareil est injoignable 99 % du temps) :
# il se contente d'exposer trois entités que l'ESP importe au réveil.
#
# Cycle d'un réveil :
#   1. Wi-Fi + Native API.
#   2. ~6 s pour laisser HA pousser les entités importées ; on en profite pour
#      lire la tension batterie (pont diviseur activé sur GPIO6, mesure sur GPIO1).
#   3. maintenance ON  -> on reste éveillé (OTA), pas de sommeil.
#   4. hash cible (+ suffixe "-lowbat" si batterie basse) == hash affiché -> rien.
#      différent -> download BMP + redessin (avec pastille batterie si basse).
#   5. deep sleep pour `refresh_seconds` (fourni par HA via /api/v1/display/meta),
#      borné [60 s, 6 h].
#
# Contrat Home Assistant (voir homeassistant/eink_dashboard_battery.yaml) :
#   sensor.eink_dashboard_target_hash       state = hash cible, attribut refresh_seconds
#   input_text.eink_dashboard_shown_hash    ce que HA croit affiché à l'écran
#   input_boolean.eink_dashboard_maintenance  fenêtre où l'ESP reste éveillé (OTA)

substitutions:
  device_name: eink-dashboard
  # "Eink Dashboard" (sans tiret) -> slug HA "eink_dashboard". "E-ink Dashboard"
  # donnait "e_ink_dashboard" pour les entités et cassait le package HA.
  friendly_name: "Eink Dashboard"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - logger.log: "réveil : début du cycle de rafraîchissement"
      - wait_until:
          condition:
            and:
              - wifi.connected:
              - api.connected:
          timeout: 30s
      # Fenêtre où HA pousse les entités importées ; on active le pont diviseur
      # batterie (GPIO6) pendant ce temps puis on lit la tension (GPIO1).
      - output.turn_on: adc_enable
      - delay: 6s
      - component.update: battery_voltage
      - output.turn_off: adc_enable
      - if:
          condition:
            lambda: "return id(maintenance_mode).state;"
          then:
            - logger.log: "maintenance ON : l'appareil reste éveillé (pas de deep sleep)"
            - deep_sleep.prevent: ds
          else:
            - lambda: |-
                // Suffixe "-lowbat" : franchir le seuil batterie force un redraw
                // (apparition / disparition de la pastille), sinon l'écran est figé.
                std::string target = id(ha_target_hash).state;
                if (target.empty()) { id(need_redraw) = false; return; }
                if (id(battery_low)) target += "-lowbat";
                id(pending_hash) = target;
                id(need_redraw) = (target != id(ha_shown_hash).state);
            - if:
                condition:
                  lambda: "return id(need_redraw);"
                then:
                  - logger.log:
                      format: "contenu changé (%s), téléchargement"
                      args: ["id(pending_hash).c_str()"]
                  - component.update: dashboard_image   # -> on_download_finished / on_error
                else:
                  - logger.log: "contenu inchangé, rendormissement immédiat"
                  - script.execute: enter_sleep

esp32:
  board: esp32-c3-devkitm-1

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Reconnexion la plus rapide possible : c'est le poste de conso dominant d'un réveil.
  fast_connect: true
  # La Freebox expose 2 AP même canal ; le roaming post-connexion d'ESPHome
  # décroche une connexion pourtant bonne puis redémarre l'adaptateur (~50 s de
  # coupure) — fatal pour un réveil de ~10 s. Cf. logs firmware secteur 2026-09-03.
  post_connect_roaming: false
  # Renseigner dans secrets.yaml pour éviter le DHCP à chaque réveil (gros gain).
  manual_ip:
    static_ip: !secret static_ip
    gateway: !secret gateway
    subnet: !secret subnet

time:
  - platform: homeassistant
    id: ha_time

# Deep sleep : `run_duration` est un failsafe (si le cycle se bloque, on dort
# quand même) ; en fonctionnement normal c'est `enter_sleep` qui déclenche le
# sommeil, plus tôt, avec la durée fournie par HA.
deep_sleep:
  id: ds
  run_duration: 120s
  sleep_duration: 30min

globals:
  - id: pending_hash
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: need_redraw
    type: bool
    restore_value: no
    initial_value: "false"
  # Persisté (survit au deep sleep) : porte l'hystérésis du seuil batterie basse
  # d'un réveil à l'autre, sinon la pastille clignoterait autour du seuil.
  - id: battery_low
    type: bool
    restore_value: yes
    initial_value: "false"

http_request:
  timeout: 15s

# Alimente le pont diviseur de tension batterie (carte pilote Seeed) : HIGH le
# temps de la mesure, LOW le reste du temps pour ne pas vider la batterie.
output:
  - platform: gpio
    pin: GPIO6
    id: adc_enable

# --- Entités importées de Home Assistant ---------------------------------
text_sensor:
  - platform: homeassistant
    id: ha_target_hash
    entity_id: sensor.eink_dashboard_target_hash
  - platform: homeassistant
    id: ha_shown_hash
    entity_id: input_text.eink_dashboard_shown_hash
  - platform: version
    name: "ESPHome version"
  - platform: template
    id: shown_hash
    name: "Content hash"

sensor:
  - platform: homeassistant
    id: ha_sleep_seconds
    entity_id: sensor.eink_dashboard_target_hash
    attribute: refresh_seconds
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
  # Tension batterie : broche A0 (GPIO1) de la carte pilote, pont diviseur /2.
  # Lue uniquement sur `component.update` (cf. on_boot), pont préalablement activé.
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "Tension batterie"
    unit_of_measurement: V
    accuracy_decimals: 2
    attenuation: 12db
    samples: 10
    update_interval: never
    filters:
      - multiply: 2.0
    on_value:
      then:
        - component.update: battery_percent
        - lambda: |-
            const float v = id(battery_voltage).state;
            if (isnan(v)) return;
            // Hystérésis 3.55 / 3.65 V (tension mesurée sous charge Wi-Fi).
            if (v < 3.55f) id(battery_low) = true;
            else if (v > 3.65f) id(battery_low) = false;
  - platform: template
    id: battery_percent
    name: "Batterie"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    update_interval: never
    lambda: |-
      const float v = id(battery_voltage).state;
      if (isnan(v)) return {};
      // Courbe LiPo approximative ; pessimiste car mesurée sous charge Wi-Fi.
      const float pts[6][2] = {
        {3.30f, 0.0f}, {3.60f, 15.0f}, {3.70f, 35.0f},
        {3.80f, 60.0f}, {3.95f, 85.0f}, {4.20f, 100.0f},
      };
      if (v <= pts[0][0]) return 0.0f;
      for (int i = 1; i < 6; i++) {
        if (v < pts[i][0]) {
          const float f = (v - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]);
          return pts[i - 1][1] + f * (pts[i][1] - pts[i - 1][1]);
        }
      }
      return 100.0f;

binary_sensor:
  - platform: homeassistant
    id: maintenance_mode
    entity_id: input_boolean.eink_dashboard_maintenance
  - platform: status
    name: "Status"
  - platform: template
    name: "Batterie faible"
    device_class: battery
    lambda: "return id(battery_low);"

spi:
  clk_pin: GPIO8
  mosi_pin: GPIO10

online_image:
  - id: dashboard_image
    url: !secret dashboard_image_url
    format: BMP
    type: BINARY
    update_interval: never
    on_download_finished:
      - component.update: main_display
      - text_sensor.template.publish:
          id: shown_hash
          state: !lambda "return id(pending_hash);"
      - logger.log: "image dashboard affichée"
      - script.execute: enter_sleep
    on_error:
      # Pas de publication : HA garde l'ancien hash affiché -> nouvelle tentative
      # au prochain réveil. Écran inchangé.
      - logger.log:
          format: "échec téléchargement image dashboard"
          level: WARN
      - script.execute: enter_sleep

display:
  - platform: waveshare_epaper
    id: main_display
    cs_pin: GPIO3
    dc_pin: GPIO5
    busy_pin:
      number: GPIO4
      inverted: true
    reset_pin: GPIO2
    model: 7.50inv2
    update_interval: never
    lambda: |-
      // BMP 1 bit : bit à 1 = pixel blanc. On échange on/off pour que le fond
      // blanc reste blanc et le texte noir reste noir (sinon rendu inversé).
      it.image(0, 0, id(dashboard_image), COLOR_OFF, COLOR_ON);
      // Pastille "batterie faible" dans la zone vide de l'en-tête (batterie + "!").
      if (id(battery_low)) {
        const int x = 300, y = 25, w = 36, h = 17;
        it.rectangle(x, y, w, h, COLOR_ON);
        it.filled_rectangle(x + w, y + 5, 3, h - 10, COLOR_ON);
        it.filled_rectangle(x + w / 2 - 1, y + 4, 3, h - 9, COLOR_ON);
        it.filled_rectangle(x + w / 2 - 1, y + h - 4, 3, 2, COLOR_ON);
      }

script:
  - id: enter_sleep
    then:
      - if:
          condition:
            lambda: "return id(maintenance_mode).state;"
          then:
            - logger.log: "maintenance ON : deep sleep annulé"
            - deep_sleep.prevent: ds
          else:
            - delay: 2s
            - deep_sleep.enter:
                id: ds
                sleep_duration: !lambda |-
                  float s = id(ha_sleep_seconds).state;
                  if (isnan(s) || s < 60.0f) s = 1800.0f;   // défaut si HA muet
                  if (s > 21600.0f) s = 21600.0f;            // plafond 6 h
                  return (uint32_t) (s * 1000.0f);
