# Copier en firmware/secrets.yaml (non versionné) et renseigner.
# Générer la clé API : https://esphome.io/components/api.html  (openssl rand -base64 32)

wifi_ssid: "MON_WIFI"
wifi_password: "mot-de-passe-wifi"

api_encryption_key: "base64-32-octets-a-generer"
ota_password: "mot-de-passe-ota"

# IP LAN de la machine qui fait tourner FastAPI (docker compose, port 8000).
dashboard_image_url: "http://192.168.1.10:8000/image/dashboard.bmp"

# --- Uniquement pour la variante mode batterie (xiao-epaper-battery.yaml) -----
# IP fixe de l'ESP pour éviter le DHCP à chaque réveil (gros gain d'autonomie).
static_ip: "192.168.1.42"
gateway: "192.168.1.1"
subnet: "255.255.255.0"
